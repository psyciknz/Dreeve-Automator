name: Build and publish Docker image

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image version
        id: version
        run: |
          TAG="$(git tag --points-at "${{ github.event.pull_request.head.sha }}" | head -n 1)"

          if [ -n "$TAG" ]; then
            VERSION="$TAG"
          else
            VERSION="pr-${{ github.event.pull_request.number }}"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using image version: $VERSION"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dreeve-automator:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/dreeve-automator:pr-${{ github.event.pull_request.number }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
