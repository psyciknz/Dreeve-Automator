{% extends "base.html" %}
{% block content %}
<div id="collection" data-kind="templates">
  <section id="list-view">
    <div class="page-head">
      <h1>Templates</h1>
      <button class="primary" id="new-btn">New template</button>
    </div>
    <p class="muted">
      A template names an activity from its metrics. The lowest priority number that passes its
      restrictions and can be fully filled in wins.
    </p>
    <div id="list"></div>
  </section>

  <section id="editor-view" class="card" hidden>
    <h2 id="editor-title">Template</h2>
    {% include "_editor_fields.html" %}
    <div class="form-error" id="form-error" hidden></div>
    <div class="actions">
      <button class="primary" id="save-btn">Save</button>
      <button id="cancel-btn">Cancel</button>
    </div>
  </section>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/templates.js') }}"></script>{% endblock %}
